name: bitlife_like
description: "A BitLife-like game created with Flutter."
version: 1.0.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  uuid: ^4.5.1
  collection: ^1.19.1
  device_info_plus: ^11.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/bitlife_logo.png
    - assets/data/financial/tax_data.json
    - assets/data/financial/banks.json
    - assets/data/character/skills.json
    - assets/data/crafting/components.json
    - assets/data/crafting/recipes.json
    - assets/data/company/company_catalog.json
